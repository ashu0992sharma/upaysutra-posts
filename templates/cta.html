<!doctype html>
<html lang="hi"><head><meta charset="utf-8">
<style>
{% include "base.css" %}
.bg { filter: blur(14px) brightness(.5); transform: scale(1.08); }
.shade { background: radial-gradient(ellipse at 50% 40%, rgba(var(--night),.30) 0%, rgba(var(--night),.90) 72%); }
.wrap { position: absolute; left: 80px; right: 80px; top: 360px; text-align: center; }
h1 { font-family: "Baloo 2"; font-weight: 800; font-size: 76px; line-height: 1.2; color: var(--ink);
     text-shadow: 0 4px 18px rgba(0,0,0,.6); }
.sub { margin-top: 34px; font-size: 44px; font-weight: 600; line-height: 1.35; color: var(--gold); }
.button { position: absolute; left: 110px; right: 110px; bottom: 210px; text-align: center;
          padding: 30px 20px; border-radius: 999px; font-size: 42px; font-weight: 700; color: #2A1A00;
          background: linear-gradient(180deg, #FFE08A, var(--gold) 55%, var(--saffron));
          box-shadow: 0 10px 40px rgba(242,140,40,.35); }
.foot { position: absolute; left: 0; right: 0; bottom: 150px; text-align: center; font-size: 32px; color: var(--gold-soft); font-weight: 600; }
</style></head>
<body>
  <div class="bg"></div><div class="shade"></div><div class="scrim"></div>
  <div class="topbar">
    {% include "_logo.html" %}
    <div class="chip">{{ date_chip }}</div>
  </div>
  <div class="wrap">
    <h1>{{ cta.title }}</h1>
    <div class="sub">{{ cta.subtitle }}</div>
  </div>
  <div class="button">{{ cta.button }}</div>
  <div class="foot">{{ cta.footnote }}</div>
  <div class="footer"><div></div><div>{{ page }}</div></div>
</body></html>
