# Publishes whatever is due (6:00/6:15 AM and 8:00/8:15 PM IST). Runs every 15 min
# around those times because GitHub's scheduler can start jobs late; a post is
# published once, and never more than 2 h late.
name: Publish due posts
on:
  schedule:
    - cron: "0,15,30,45 0,14 * * *"   # 05:30–06:15 and 19:30–20:15 IST
    - cron: "0,30 1,15 * * *"         # 06:30–07:00 and 20:30–21:00 IST (catch-up)
  workflow_dispatch:
concurrency: { group: postgen-state, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_MEDIA_BUCKET: ${{ secrets.R2_MEDIA_BUCKET }}
      MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      DRY_RUN: ${{ vars.DRY_RUN }}      # repo variable: "true" until go-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m postgen sync down
      - run: python -m postgen publish ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}
      - if: always()
        run: python -m postgen sync up
