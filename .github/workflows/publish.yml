# Publishes whatever is due. Runs every 5 minutes through the morning and evening
# posting windows (IST): GitHub's scheduler can skip or delay runs, so frequent runs
# mean a missed run is caught a few minutes later. Each post goes out once and never
# more than 2 h late; runs are queued one at a time, so they can't overlap.
name: Publish due posts
on:
  schedule:
    - cron: "*/5 0,1 * * *"       # 05:30–07:29 IST (6:00 and 6:15 AM slots)
    - cron: "*/5 14,15 * * *"     # 19:30–20:59 IST (8:00 and 8:15 PM slots)
  workflow_dispatch:
concurrency: { group: postgen-state, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_MEDIA_BUCKET: ${{ secrets.R2_MEDIA_BUCKET }}
      MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      DRY_RUN: ${{ vars.DRY_RUN }}      # repo variable: "true" until go-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m postgen sync down --light
      - run: python -m postgen publish ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}
      - if: always()
        run: python -m postgen sync up --light
