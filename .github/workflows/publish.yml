# Publishes whatever is due. A Cloudflare cron dispatches it at the slot times
# (6:00, 6:15, 6:30 AM and 8:00, 8:15, 8:30 PM IST; the :30 runs retry anything that
# failed). GitHub's own schedule below is only a fallback in case Cloudflare misses:
# it is often late, which is fine within the 2 h limit. Each post goes out once and
# never more than 2 h late; runs are queued one at a time, so they can't overlap.
# (Until 22 Nov 2026 this ran every 5 minutes: ~50 runs a day, nearly all idle.)
name: Publish due posts
on:
  schedule:
    - cron: "30 1 * * *"          # 07:00 IST fallback for the morning slots
    - cron: "30 15 * * *"         # 21:00 IST fallback for the evening slots
  workflow_dispatch:
concurrency: { group: postgen-state, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_MEDIA_BUCKET: ${{ secrets.R2_MEDIA_BUCKET }}
      MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      DRY_RUN: ${{ vars.DRY_RUN }}      # repo variable: "true" until go-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m postgen sync down --light
      - run: python -m postgen publish ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}
      - if: always()
        run: python -m postgen sync up --light
