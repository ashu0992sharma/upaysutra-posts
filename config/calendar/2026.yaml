# Festival-specific timings shown on the post, copied from the festival's
# Drik Panchang page (New Delhi). Curated, not computed: kalagana's moonrise and
# tithi ends differ from Drik by 3–6 min, which matters for e.g. breaking the
# Karwa Chauth fast. Labels are shown as-is (Hinglish). Only listed timings are
# shown; the caption LLM is told exactly which ones exist.
timings:
  2026-10-25:  # Sharad Purnima — /purnima/sharad/sharad-purnima-date-time.html?year=2026
