# Festival & vrat dates for New Delhi — the ONLY source of occasion dates.
#
# Source: drikpanchang.com, New Delhi, monthly festival pages + vrat lists
# (/festivals/month/festivals-<month>.html?year=2026), fetched 2026-10-24.
#
# Curation rules (keep consistent when adding a year):
#   - Names copied as Drik spells them.
#   - North-Indian observances only. Regional duplicates are left out because
#     they'd match the wrong rule: "Hanuman Jayanti *Kannada", "Naga Panchami
#     *Telugu", "Bengal Vijayadashami", "Mysore Dasara", "Tamil Deepavali".
#   - Purnima: keep the vrat day ("... Purnima Vrat"); drop the next-day
#     snan-daan duplicate. Amavasya: keep the snan-daan day ("<Month> Amavasya");
#     drop "Darsha Amavasya".
#   - Shraddha days, Ishti/Anvadhan, Rohini Vrat, Masik Karthigai etc. are
#     omitted: we never post on them.
#
# `python -m postgen check-calendar` verifies each vrat/festival date against
# the tithi kalagana computes for that day (catches typos and shifted dates).

covers: {from: 2026-10-01, to: 2026-12-31}

