captions:
  model: claude-sonnet-5-5
  effort: medium        # low | medium | high; captions are short creative text
  max_attempts: 3       # regenerate when guardrail checks fail, then flag the day
  rashifal:             # Panchang days: carousel with this many rotating rashis
    enabled: true
    per_day: 3
images:
  # Looked up 2026-10-24 at ai.google.dev/gemini-api/docs/image-generation + /pricing.
  # No image model has a free tier now; prices are per image (standard, not batch).
  primary_model: gemini-nano-banana-2.1      # Google's recommended image model
  secondary_model: gemini-3.1-flash-lite-image  # cheaper/lighter, used after primary fails
  image_size: 2K            # 1K upscaled to 1080x1350 looks soft; 2K is downscaled instead
  aspect_ratio: "4:5"       # falls back to 3:4 + crop if a model rejects 4:5
  price_usd:                # for state/generation_log.jsonl cost estimates
    gemini-nano-banana-2.1: {1K: 0.0336, 2K: 0.0504, 4K: 0.113}
    gemini-3.1-flash-lite-image: {1K: 0.0336}
  retries: 3                # per model, exponential backoff
  qa_model: claude-sonnet-5-5   # automatic review of every new background (postgen/imageqa.py)
  qa_regenerations: 2           # after a rejection, try this many more images before giving up
  reuse_window_days: 28
  min_unused_per_tag: 3
  generate_batch: 2
  bootstrap_per_tag: 3
render:
  width: 1080
  height: 1350

automation:
  mode: veto                 # veto: nightly preview email, posts go out unless paused · auto: no previews
  timezone: Asia/Kolkata
  times:                     # local publish time per slot
    post_am: "06:00"
    story_am: "06:15"
    post_pm: "20:00"
    story_pm: "20:15"
  platforms: [instagram, facebook]
  am_post: reel              # reel: the 6 AM slot posts the day's reel (carousel is the fallback if no reel) · carousel
  graph_api_version: v25.0   # Meta Graph API; check developers.facebook.com/docs/graph-api/changelog
  duplicate_window_minutes: 60   # before publishing, skip a slot if any post exists within ±60 min
  late_limit_minutes: 120    # never publish a slot more than 2 h late (stale "aaj"/"kal" content)
  calendar_warn_days: 21     # alert when the festival calendar runs out within this many days

reels:
  # ElevenLabs text-to-speech (needs ELEVENLABS_API_KEY; Starter plan or above for commercial use)
  voice_id: 3zfVMgyQmfzZpm8pYvD2      # "Shivank S – Scriptures & Mythology" (calm male Hindi)
  tts_model: eleven_multilingual_v2
  voice_settings: {stability: 0.6, similarity_boost: 0.8, style: 0.15, speed: 0.92}
  pause_seconds: 0.35                  # gap after each spoken line
  max_script_chars: 320                # keeps reels ~15–25 s and credits low
  # What the voice hears instead (screen text is unchanged). Add words here when the voice says them wrong.
  pronounce:
    UpaySutra: उपाय सूत्र
    Upaysutra: उपाय सूत्र
    रमा एकादशी: रामा एकादशी
  fps: 30
